# ONYX VAULT - Angepasste Gradle Properties fuer begrenzten Speicher (5 GB RAM)
# Konservative Werte nach OOM-Crash am 2026-10-09

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin Daemon separat (sonst doppelt Memory)
kotlin.daemon.jvm.options=-Xmx1536m -XX:MaxMetaspaceSize=256m -XX:-UseParallelGC

# Parallel-Build DEAKTIVIERT (spart Speicher)
org.gradle.parallel=false
org.gradle.caching=true

# Configuration Cache - WICHTIG: wenn Build-Config aenderte, mit --rerun-tasks oder stop/clean
org.gradle.configuration-cache=true

kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

android.suppressUnsupportedCompileSdk=36

# Incremental
kotlin.incremental=true
org.gradle.daemon.idletimeout=1800000

# Performance
android.nonTransitiveRClass=true
android.useNativeHeapCheck=true
android.package.useLegacyPackaging=true
