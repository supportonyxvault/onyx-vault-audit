server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /var/www/[REDACTED-VM-HOSTNAME];
    index killswitch.html index.html;

    access_log off;
    error_log /var/log/nginx/onyx-error.log warn;

    # ─── Security Headers (post-audit + re-audit 2026-10-16) ─────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # AUDIT MED/HIGH-4 + NEU-4: CSP strict, KONKRETE connect-src Hosts
    # (vorher wildcard wss://*.com erlaubt - jetzt konkret aufgelistet)
    # Inline-Scripts extrahiert, jsPDF/pdf.js lokal vendored.
    # Nostr-Relays sind die 6 Clearnet-Relays aus relay_publish_server.js + .onion wildcard
    # (bei .onion keine echten Hostname-Spoofs moeglich weil Tor-Routing kryptografisch).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://relay.damus.io wss://nos.lol wss://nostr.wine wss://relay.snort.social wss://offchain.pub wss://purplerelay.com wss://relays.meowl.social wss://*.onion ws://*.onion; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    location ~ /\. { deny all; }

    # ─── /relay-publish Proxy (AUDIT CRITICAL-1 + NEU-1/NEU-2) ───────
    # Rate-Limit greift jetzt auf X-Real-IP (im Node-Server), CORS strikt
    location /relay-publish {
        limit_except POST OPTIONS { deny all; }

        proxy_pass http://127.0.0.1:3000/relay-publish;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 32k;
    }

    location /relay-health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /killswitch.html;
    }
}
